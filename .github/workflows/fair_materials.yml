name: Validate and reproduce
on:
  push:
  pull_request:
permissions:
  contents: read
defaults:
  run:
    working-directory: projects/fair-materials-reproducibility
jobs:
  workflow:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: projects/fair-materials-reproducibility/requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m unittest discover -s tests -v
      - run: python examples/run_workflow.py
      - run: fair-materials validate workspace/demo/materials.csv workspace/demo/metadata.json
      - run: python examples/run_extensions.py
