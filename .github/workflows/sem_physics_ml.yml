name: SEM physics-informed ML
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy scipy torch torchvision pillow pytest
      - name: Unit tests
        run: python -m pytest -q tests/test_sem_physics_ml.py
      - name: Train and compare on synthetic maps
        run: python projects/sem-physics-ml/train.py --epochs 160 --save-checkpoint
      - name: Synthetic inference smoke test
        run: python projects/sem-physics-ml/predict.py --demo
      - name: Test trained inference
        run: python -m pytest -q tests/test_sem_physics_ml.py
      - uses: actions/upload-artifact@v4
        with:
          name: sem-physics-ml-synthetic
          path: projects/sem-physics-ml/results/
